version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build: ../services/auth-service
    env_file: ../services/auth-service/.env
    ports:
      - "4001:4001"
    depends_on:
      - mongo

  donor-service:
    build: ../services/donor-service
    env_file: ../services/donor-service/.env
    ports:
      - "4002:4002"
    depends_on:
      - mongo

  request-service:
    build: ../services/request-service
    env_file: ../services/request-service/.env
    ports:
      - "4003:4003"
    depends_on:
      - mongo

  verification-service:
    build: ../services/verification-service
    env_file: ../services/verification-service/.env
    ports:
      - "4004:4004"
    depends_on:
      - mongo

  notification-service:
    build: ../services/notification-service
    env_file: ../services/notification-service/.env
    ports:
      - "4005:4005"
    depends_on:
      - mongo

  camp-service:
    build: ../services/camp-service
    env_file: ../services/camp-service/.env
    ports:
      - "4006:4006"
    depends_on:
      - mongo

  inventory-service:
    build: ../services/inventory-service
    env_file: ../services/inventory-service/.env
    ports:
      - "4007:4007"
    depends_on:
      - mongo

  gateway:
    build: ../gateway
    env_file: ../gateway/.env
    ports:
      - "4000:4000"
    depends_on:
      - auth-service

volumes:
  mongo_data:
